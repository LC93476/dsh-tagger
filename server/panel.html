<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSh Tagger · 锻造台</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #ffffff; --fg: #1b1d21; --dim: #6b7280; --line: #e3e6ea;
    --brand: #2563eb; --ok: #1f8f4e; --warn: #b45309; --err: #c02626;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101215; --card: #181b20; --fg: #e7e9ee; --dim: #9aa3b2; --line: #2a2f37;
      --brand: #5b8cff; --ok: #43c07a; --warn: #e0a800; --err: #ef5350; }
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center;
    justify-content: space-between; flex-wrap: wrap; padding: 12px 20px;
    background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 }
  .sub { color: var(--dim); font-size: 12px }
  .badges { display: flex; gap: 8px; flex-wrap: wrap }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 12px; background: var(--card); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: inline-block }
  .pill[data-state="ok"] i { background: var(--ok) }
  .pill[data-state="warn"] i { background: var(--warn) }
  .pill[data-state="err"] i { background: var(--err) }
  .pill.lamp[data-level="off"] i { background: #9aa0a6 }
  .pill.lamp[data-level="light"] i { background: #e0a800 }
  .pill.lamp[data-level="standard"] i { background: #ef7d00 }
  .pill.lamp[data-level="full"] i { background: #e03131; animation: breathe 2.4s ease-in-out infinite }
  .pill.lamp[data-level="max"] i { background: #a855f7; animation: breathe 1.4s ease-in-out infinite }
  .pill.lamp[data-enabled="off"] { opacity: .55 }
  .pill.lamp[data-enabled="off"] i { animation: none; background: #9aa0a6 }
  @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  main { max-width: 980px; margin: 0 auto; padding: 18px 20px 60px; display: flex; flex-direction: column; gap: 14px }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600; letter-spacing: .02em }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px }
  .between { justify-content: space-between }
  .grow { flex: 1 1 220px }
  label { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim) }
  input, select, textarea, button { font: inherit; color: var(--fg) }
  input[type=number] { width: 86px }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px }
  textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; resize: vertical; }
  textarea.mono { font-family: var(--mono); font-size: 12.5px; line-height: 1.7 }
  button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 14px; cursor: pointer }
  button:hover { border-color: var(--brand) }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600 }
  button.ghost { padding: 3px 9px; font-size: 12px }
  button:disabled { opacity: .55; cursor: default }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; white-space: pre-wrap }
  .err { color: var(--err) }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px }
  .chip { display: inline-flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12px;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 9px; cursor: pointer }
  .chip b { font-weight: 500 }
  .chip em { color: var(--dim); font-style: normal; font-family: inherit }
  .chip span { color: var(--dim); padding: 0 4px }
  .delta { margin-top: 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap }
  .images { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-top: 12px }
  .images figure { margin: 0 }
  .images img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block }
  .images figcaption { font-size: 11px; color: var(--dim); font-family: var(--mono); margin-top: 4px; word-break: break-all }
  .empty { color: var(--dim); font-size: 12px }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 8px }
  .grid2 label { display: flex; flex-direction: column; align-items: stretch; gap: 4px }
  .grid2 label > input { width: 100% }
  .grid2 .wide { grid-column: 1 / -1 }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr } }
  details.card > summary { cursor: pointer; font-size: 13px; color: var(--dim); font-weight: 600; letter-spacing: .02em }
  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0 6px }
  .pose-card { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 10px 6px 6px; cursor: pointer; color: inherit; font: inherit; text-align: left }
  .pose-card:hover { border-color: #4c6ef5 }
  .pose-card img { width: 44px; height: 58px; object-fit: cover; border-radius: 6px; background: #111; display: block }
  .pose-card .pt { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
  .pose-card b { font-weight: 500; font-size: 13px }
  .pose-card .pt span { font-size: 11px; color: var(--dim); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .62); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px }
  .modal[hidden] { display: none }
  .modal-box { width: min(1100px, 100%); max-height: 88vh; display: flex; flex-direction: column; gap: 10px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px }
  .modal-head { display: flex; gap: 10px; align-items: center }
  .modal-head b { font-size: 14px; font-weight: 600; white-space: nowrap }
  .modal-grid { overflow: auto; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    grid-auto-rows: min-content; align-items: start; padding-right: 4px }
  .modal-grid figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--card, #1a1a1a) }
  .modal-grid figure:hover { border-color: #4c6ef5 }
  .modal-grid figure.on { border-color: #4c6ef5; box-shadow: 0 0 0 1px #4c6ef5 inset }
  .modal-grid img { width: 100%; height: 176px; object-fit: cover; object-position: top center; display: block; background: #fff }
  .modal-grid figcaption { padding: 4px 6px; font-size: 11px; line-height: 1.35 }
  .modal-grid figcaption em { display: block; color: var(--dim); font-style: normal; font-family: var(--mono); font-size: 10px }
  .sets { display: flex; gap: 6px; flex-wrap: wrap }
  .sets button { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer }
  .sets button.on { background: #4c6ef5; border-color: #4c6ef5; color: #fff }
</style>
</head>
<body>
<header>
  <div>
    <h1>DSh Tagger · 锻造台</h1>
    <div class="sub">白话 → WD + Camie 标签 → 二次精修 → 直接出图。负向与画质词由 ComfyUI 工作流内置。</div>
  </div>
  <div class="badges">
    <span class="pill lamp" id="lamp" data-level="full" data-enabled="on" title="破甲状态"><i></i><b>破甲</b> <span id="lamp-text">读取中</span></span>
    <span class="pill" id="llm-pill" data-state="warn"><i></i><span id="llm-text">llm 读取中</span></span>
    <span class="pill" id="comfy-pill" data-state="warn"><i></i><span id="comfy-text">ComfyUI 读取中</span></span>
  </div>
</header>
<main>
  <details class="card" id="settings-card" open>
<summary>接口设置（模型 API 与 ComfyUI 连接）</summary>
<div class="hint">填完点保存写进 settings.json，<b>立刻生效</b>，不用重启。DSH 面板里不用填这些 —— 那边走宿主的模型服务。</div>
<div class="grid2">
<label class="wide">接口地址（OpenAI 兼容，可带 /v1）<input id="llm-baseurl" placeholder="https://api.openai.com/v1" spellcheck="false"></label>
<label class="wide">API Key<input id="llm-key" type="password" placeholder="没配过就粘进来；已经配过留空表示不改" spellcheck="false" autocomplete="off"></label>
<label>模型名<input id="llm-model" placeholder="deepseek-v4.1-flash" spellcheck="false"></label>
<label>provider 名<input id="llm-provider" placeholder="openai-compatible" spellcheck="false"></label>
</div>
<div class="row"><button id="llm-save" class="primary">保存接口</button><button id="llm-test" class="ghost">测试连接</button><span class="hint" id="llm-status" style="margin:0"></span></div>
<hr class="sep">
<div class="grid2">
<label class="wide">ComfyUI 地址<input id="comfy-baseurl" placeholder="http://127.0.0.1:8188" spellcheck="false"></label>
<label class="wide">安装目录（点「启动 ComfyUI」用的工作目录）<input id="comfy-dir" placeholder="D:\QUARK\ComfyUI-aki-v3.2\ComfyUI" spellcheck="false"></label>
<label class="wide">python 路径<input id="comfy-python" placeholder="D:\QUARK\ComfyUI-aki-v3.2\python\python.exe" spellcheck="false"></label>
<label class="wide">工作流模板目录<input id="comfy-workflows" placeholder="C:\Users\你\.dsh-comfyui-workbench\workflows" spellcheck="false"></label>
<label>默认工作流 id<input id="comfy-default" placeholder="feiyue-sam3-posetags" spellcheck="false"></label>
</div>
<div class="row"><button id="comfy-save" class="primary">保存 ComfyUI</button><button id="comfy-ping" class="ghost">检测连通</button><button id="comfy-launch" class="ghost">启动 ComfyUI</button><span class="hint" id="comfy-status" style="margin:0"></span></div>
</details>
<section class="card">
    <div class="row between" style="margin-top:0"><h2 style="margin:0">白话描述</h2><span class="hint" id="forge-status" style="margin:0"></span></div>
    <textarea id="text" rows="4" placeholder="例：室内夜晚，裸体少女躺在床边回头看镜头，紫瞳黑长发，油亮皮肤，柔和暖光"></textarea>
    <div class="row">
      <label>最多标签 <input id="maxTags" type="number" min="8" max="160" value="40"></label>
      <label>破甲档 <select id="level">
        <option value="off">off</option><option value="light">light</option>
        <option value="standard">standard</option><option value="full">full</option>
        <option value="max">max</option>
      </select></label>
      <button id="save-level" class="ghost">应用档位</button>
      <label title="库里查不到的多词会被改成连字符/撇号写法">词形修复 <input id="fg-repair" type="checkbox" checked></label>
      <label title="去重、上位词降权、按 13 段稳定排序">去重合序 <input id="fg-postprocess" type="checkbox" checked></label>
      <label title="白话里点到的姿势/视角，直接从本地词库补进来">姿势补全 <input id="fg-posehints" type="checkbox" checked></label>
      <label title="锻造前先从词库捞一批真词喂给模型">候选注入 <input id="fg-candidates" type="checkbox" checked></label>
      <span class="grow"></span>
      <button id="forge" class="primary">锻造</button>
    </div>
  </section>
  <section class="card" id="result-card" hidden>
    <div class="row between" style="margin-top:0"><h2 style="margin:0">中英对照 · 带权重</h2><button id="copy-pair" class="ghost">复制</button></div>
    <textarea id="pairs" class="mono" rows="8" readonly spellcheck="false"></textarea>
    <div class="row between"><h2 style="margin:0">正向串（投给 ComfyUI 的就是这份）</h2><button id="copy-pos" class="ghost">复制</button></div>
    <textarea id="positive" class="mono" rows="3" spellcheck="false"></textarea>
    <div class="chips" id="chips"></div>
    <div class="hint" id="pipeline"></div>
    <div class="hint" id="notes"></div>
  </section>
  <section class="card" id="refine-card" hidden>
    <h2>二次精修（不需要重打白话）</h2>
    <div class="row" style="margin-top:0">
      <select id="refine-mode">
        <option value="add">add · 只加</option>
        <option value="edit">edit · 加与删</option>
        <option value="prune">prune · 只删</option>
        <option value="weights">weights · 只调权重</option>
      </select>
      <input id="refine-text" class="grow" placeholder="例：加夜景与逆光，胸口再露一点 / 去掉多余的手 / 主体权重提到 1.2">
      <button id="refine" class="primary">精修</button>
    </div>
    <div class="hint" id="refine-status"></div>
    <div class="delta" id="refine-delta"></div>
  </section>
  <section class="card" id="gen-card">
    <h2>出图</h2>
    <div class="row" style="margin-top:0">
      <select id="workflow" class="grow"></select>
    </div>
    <div class="row" id="ref-row">
      <label class="grow">参考图（任意照片/线稿，走 DepthAnythingV2 → ControlNet）
        <input id="ref-file" type="file" accept="image/png,image/jpeg,image/webp">
      </label>
      <img id="ref-preview" alt="" style="display:none;width:64px;height:auto;border-radius:6px;border:1px solid var(--line, #333)">
    </div>
    <div class="hint" id="ref-status"></div>
    <div class="row">
      <button id="pose-btn" class="pose-card" type="button" style="flex:1">
        <img id="pose-thumb" alt="" hidden>
        <span class="pt"><b id="pose-name">还没有选姿势</b><span id="pose-meta">点这里按缩略图挑</span></span>
      </button>
      <label>CN 强度 <input id="cnstrength" type="number" value="0.38" step="0.01" min="0" max="1.5" style="width:80px"></label>
    </div>
    <select id="pose" hidden></select>
    <div class="row">
      <label>宽 <input id="width" type="number" value="1200" step="64"></label>
      <label>高 <input id="height" type="number" value="1800" step="64"></label>
      <label>seed <input id="seed" type="number" value="20261108" style="width:120px"></label>
      <label>步数 <input id="steps" type="number" value="30"></label>
      <label>cfg <input id="cfg" type="number" value="5.03" step="0.01" style="width:74px"></label>
      <button id="run" class="primary">出图</button>
    </div>
    <div class="hint" id="gen-status"></div>
    <div class="images" id="images"></div>
  </section>
</main>
<div class="modal" id="pose-modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <b>选姿势 · 缩略图对照</b>
      <input id="pose-q" class="grow" placeholder="搜中文名 / 编号 P016 / 分类（坐姿、趴卧、跪立…）" style="flex:1">
      <button id="pose-close" type="button">关闭</button>
    </div>
    <div class="sets" id="pose-sets"></div>
    <div class="modal-grid" id="pose-grid"></div>
    <div class="hint" id="pose-count"></div>
  </div>
</div>
<script>
var BASE = "/tagger/api";
var state = { result: null, workflows: [], timer: null, refName: "", poses: [], poseIndex: {}, poseSet: "", poseQuery: "" };
function $(id) { return document.getElementById(id) }
function trimNum(n) { return String(Math.round(n * 1000) / 1000) }
function pairOf(t) {
  var head = (typeof t.weight === "number" && Math.abs(t.weight - 1) >= 0.005) ? "(" + t.tag + ":" + trimNum(t.weight) + ")" : t.tag;
  return t.cn ? head + " — " + t.cn : head;
}
function positiveText() {
  var tags = (state.result && state.result.tags) || [];
  return tags.map(function (t) {
    return (typeof t.weight === "number" && Math.abs(t.weight - 1) >= 0.005) ? "(" + t.tag + ":" + trimNum(t.weight) + ")" : t.tag;
  }).join(", ");
}
async function api(path, init) {
  var options = Object.assign({ headers: { "content-type": "application/json" } }, init || {});
  var res = await fetch(BASE + path, options);
  var data = {};
  try { data = await res.json() } catch (e) { data = { ok: false, message: "响应不是 JSON（HTTP " + res.status + "）" } }
  return { status: res.status, data: data };
}
function setPill(id, kind, text) {
  var pill = $(id);
  if (!pill) return;
  pill.dataset.state = kind;
  // id 是 "llm-pill" 而文案节点叫 "llm-text"，两种写法都容错，别让一个 null 把 boot 打死。
  var label = $(id + "-text") || $(id.replace(/-pill$/, "") + "-text");
  if (label) label.textContent = text;
}
function setLamp(purge) {
  var lamp = $("lamp");
  var level = purge && typeof purge.level === "string" ? purge.level : "full";
  lamp.dataset.level = level;
  lamp.dataset.enabled = purge && purge.enabled === false ? "off" : "on";
  var modules = purge && Array.isArray(purge.modules) ? purge.modules.length : 0;
  $("lamp-text").textContent = level + (modules ? " · " + modules + " 模块" : "");
  if ($("level").value !== level) $("level").value = level;
}
function renderResult() {
  var r = state.result;
  $("result-card").hidden = !r;
  $("refine-card").hidden = !r;
  $("gen-card").hidden = false;   // 出图区常显：参考图、姿势库、工作流不依赖是否锻造过
  if (!r) return;
  var tags = r.tags || [];
  $("pairs").value = tags.map(pairOf).join("\n");
  $("positive").value = positiveText();
  var chips = $("chips");
  chips.innerHTML = "";
  tags.forEach(function (t, i) {
    var el = document.createElement("span");
    el.className = "chip";
    var b = document.createElement("b"); b.textContent = t.tag;
    el.appendChild(b);
    if (t.cn) { var em = document.createElement("em"); em.textContent = t.cn; el.appendChild(em) }
    var x = document.createElement("span"); x.textContent = "×"; x.title = "删掉这条";
    x.onclick = function () { tags.splice(i, 1); renderResult() };
    el.appendChild(x);
    chips.appendChild(el);
  });
  var pipe = r.pipeline || {};
  var parts = [];
  if ((pipe.repairs || []).length) parts.push("修正 " + pipe.repairs.map(function (x) { return x.from + "→" + x.to }).join("、"));
  if ((pipe.poseHints || []).length) parts.push("补词 " + pipe.poseHints.map(function (x) { return x.tag }).join("、"));
  if ((pipe.changes || []).length) parts.push("整理 " + pipe.changes.map(function (x) { return x.tag }).join("、"));
  $("pipeline").textContent = parts.length ? "本地处理 · " + parts.join(" · ") : "";
  var notes = [];
  if (r.notes) notes.push(r.notes);
  (r.warnings || []).forEach(function (w) { notes.push("· " + w) });
  notes.push("标签 " + tags.length + " 条 · " + (r.ms || 0) + " ms · " + (r.model || "") + " · 破甲 " + (r.purgeLevel || "?"));
  $("notes").className = "hint";
  $("notes").textContent = notes.join("\n");
}
function readVars() {
  var vars = {
    width: Number($("width").value) || 1200,
    height: Number($("height").value) || 1800,
    seed: Number($("seed").value) || 0,
    steps: Number($("steps").value) || 30,
    cfg: Number($("cfg").value) || 5
  };
  // 只有姿势类模板才有 pose / cnStrength 变量，别的模板塞进去会被丢掉并留 warning。
  var wid = $("workflow").value || "";
  if (wid.indexOf("pose") >= 0) {
    var pose = $("pose").value;
    if (pose) vars.pose = pose;
  }
  // 参考图模板：image 写进 LoadImage，cnStrength 决定「多听参考图的」
  if (wid.indexOf("ref") >= 0) {
    if (state.refName) vars.image = state.refName;
    var refStrength = Number($("cnstrength").value);
    if (Number.isFinite(refStrength)) vars.cnStrength = refStrength;
  } else if (wid.indexOf("pose") >= 0 && wid.indexOf("posetags") < 0) {
    var strength = Number($("cnstrength").value);
    if (Number.isFinite(strength)) vars.cnStrength = strength;
  }
  return vars;
}
async function loadPoses() {
  var sel = $("pose");
  var res = await api("/poses");
  var d = res.data || {};
  var poses = d.poses || [];
  state.poses = poses;
  state.poseIndex = {};
  poses.forEach(function (p) { state.poseIndex[p.id] = p });
  renderPoseSets();
  if (!poses.length) {
    sel.innerHTML = "<option value=\"\">（没读到姿势库，检查 ComfyUI 目录下的 ai-pose-gallery-zh）</option>";
    return;
  }
  sel.innerHTML = "";
  var groups = {};
  poses.forEach(function (p) {
    var key = p.set || "pose";
    if (!groups[key]) {
      var og = document.createElement("optgroup");
      og.label = key;
      groups[key] = og;
      sel.appendChild(og);
    }
    var o = document.createElement("option");
    o.value = p.id;
    o.textContent = (p.name || p.id) + " · " + (p.angle || "") + "（" + p.id + "）";
    groups[key].appendChild(o);
  });
  var want = "full_sexy_P016_diag";
  var exists = poses.some(function (p) { return p.id === want });
  sel.value = exists ? want : poses[0].id;
  syncPoseBtn();
  renderPoseGrid();
}

function fmtSize(bytes) {
  if (!bytes) return "0 B";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}
async function pickRef(file) {
  if (!file) return;
  var status = $("ref-status");
  status.className = "hint";
  status.textContent = "上传中…（" + fmtSize(file.size) + "）";
  var dataUrl = await new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(String(reader.result || "")) };
    reader.onerror = function () { reject(new Error("读不出这个文件")) };
    reader.readAsDataURL(file);
  });
  var res = await api("/upload", { method: "POST", body: JSON.stringify({ filename: file.name, data: dataUrl }) });
  var d = res.data || {};
  if (d.ok !== true) {
    state.refName = "";
    status.className = "hint err";
    status.textContent = "上传失败：" + (d.message || d.error || ("HTTP " + res.status));
    return;
  }
  state.refName = d.name;
  var preview = $("ref-preview");
  preview.src = dataUrl;
  preview.style.display = "";
  status.className = "hint";
  status.textContent = "已上传 · " + d.name + " · " + fmtSize(d.bytes || 0) + "（出图时自动带上）";
  $("gen-status").className = "hint";
  $("gen-status").textContent = "参考图就位，点「出图」";
}

async function pollJob(promptId) {

bind("comfy-ping", pingComfy);
bind("comfy-launch", launchComfy);
$("copy-pair").addEventListener("click", function () { navigator.clipboard.writeText($("pairs").value); $("copy-pair").textContent = "已复制"; setTimeout(function () { $("copy-pair").textContent = "复制" }, 1200) });
$("copy-pos").addEventListener("click", function () { navigator.clipboard.writeText($("positive").value); $("copy-pos").textContent = "已复制"; setTimeout(function () { $("copy-pos").textContent = "复制" }, 1200) });
$("save-level").addEventListener("click", async function () {
  var res = await api("/purge", { method: "POST", body: JSON.stringify({ purge: { enabled: $("level").value !== "off", level: $("level").value } }) });
  if (res.data && res.data.purge) setLamp(res.data.purge);
});
$("text").addEventListener("keydown", function (e) { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") doForge() });
$("refine-text").addEventListener("keydown", function (e) { if (e.key === "Enter") doRefine() });
boot();
</script>
</body>
